# Checks every push on GitHub's free runners (tests + a web build). On demand (Actions → "Build apps" → Run workflow,
# tick "desktop") it also builds the Mac app (Apple silicon and Intel) and attaches it to the "latest" release.
# The iPhone/iPad version comes from your own website (Cloudflare Pages builds it itself, see docs/PHONE.md) or from
# Xcode on your Mac; this workflow needs no secrets.
name: Build apps
on:
  push:
    branches: [main, 'claude/eloquent-darwin-17z1xx']
  workflow_dispatch:
    inputs:
      desktop:
        description: Also build the Mac app
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Remove the old Android file from the release (the app is Apple-only now)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release delete-asset latest Base-Pattern-Desk-android.apk --repo "$GITHUB_REPOSITORY" --yes || true

  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Mac app (Apple silicon and Intel), ad-hoc signed
        run: |
          npx electron-builder --mac zip --arm64 --x64 --publish never
          for d in release/mac-arm64 release/mac; do codesign --force --deep --sign - "$d/Base Pattern Desk.app"; done
          (cd release/mac-arm64 && zip -qry -y ../Base-Pattern-Desk-mac-AppleSilicon.zip "Base Pattern Desk.app")
          (cd release/mac && zip -qry -y ../Base-Pattern-Desk-mac-Intel.zip "Base Pattern Desk.app")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: Mac app built from ${{ github.sha }}. Apple silicon (M1–M4) or Intel; right-click → Open the first time.
          files: |
            release/Base-Pattern-Desk-mac-AppleSilicon.zip
            release/Base-Pattern-Desk-mac-Intel.zip
