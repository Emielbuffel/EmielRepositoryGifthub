<style>
/* Layout: a Mac-style app window. Fixed sidebar of sections on the left, one working pane on the right; on a phone the sidebar becomes a scrolling tab strip. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e9edf1; --line:#d6dde4;
  --fg:#16212b; --muted:#5a6a78; --accent:#0f7a6c; --accent-soft:#d9f0ec; --on-accent:#ffffff;
  --go:#1d7f45; --go-soft:#dcf2e4; --warn:#a2650a; --warn-soft:#fbeed6; --stop:#b3261e; --stop-soft:#f8dedc;
  --f-display:"Manrope",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#17202a; --sunk:#111920; --line:#2a3744;
  --fg:#e5ecf2; --muted:#93a4b3; --accent:#3cc2ad; --accent-soft:#143a36; --on-accent:#06201c;
  --go:#5fd38b; --go-soft:#173826; --warn:#f0b351; --warn-soft:#3b2c12; --stop:#ff8a80; --stop-soft:#43201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#17202a; --sunk:#111920; --line:#2a3744;
  --fg:#e5ecf2; --muted:#93a4b3; --accent:#3cc2ad; --accent-soft:#143a36; --on-accent:#06201c;
  --go:#5fd38b; --go-soft:#173826; --warn:#f0b351; --warn-soft:#3b2c12; --stop:#ff8a80; --stop-soft:#43201d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--sunk);border-right:1px solid var(--line);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block}
.brand small{color:var(--muted);font-size:.75rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;color:var(--fg);font-weight:500}
.nav button:hover{background:var(--line)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .count{font-family:var(--f-mono);font-size:.72rem;opacity:.8}
.side .foot{margin-top:22px;padding:12px 10px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--line)}
main{padding-block:28px 60px;padding-left:max(16px,4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);min-width:0}
.view{max-width:1040px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--muted);max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:12px}
.prose ul,.prose ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.prose h3{margin-top:6px}
.tip{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.warnbox{background:var(--warn-soft);border-radius:8px;padding:12px 14px}
.stopbox{background:var(--stop-soft);border-radius:8px;padding:12px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.go{background:var(--go-soft);color:var(--go)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.stop{background:var(--stop-soft);color:var(--stop)}
.chip.info{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
label{font-size:.82rem;color:var(--muted);font-weight:500;display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.8rem}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:7px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.small{padding:4px 10px;font-size:.8rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.85rem;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.verdict{border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.verdict.go{background:var(--go-soft)} .verdict.warn{background:var(--warn-soft)} .verdict.stop{background:var(--stop-soft)}
.verdict .big{font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.verdict.go .big{color:var(--go)} .verdict.warn .big{color:var(--warn)} .verdict.stop .big{color:var(--stop)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kv div{background:var(--sunk);border-radius:8px;padding:10px 12px}
.kv span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.lessons{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.lesson-list{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.lesson-list h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.lesson-list button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;font-size:.88rem}
.lesson-list button:hover{background:var(--sunk)}
.lesson-list button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.lesson-list button:focus-visible{outline:2px solid var(--accent)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px}
.dot.done{background:var(--go);border-color:var(--go);color:var(--panel)}
.quiz{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.q{display:flex;flex-direction:column;gap:8px}
.q .opts{display:flex;flex-direction:column;gap:6px}
.q .opts button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:.9rem;background:var(--panel)}
.q .opts button:hover{border-color:var(--accent)}
.q .opts button:focus-visible{outline:2px solid var(--accent)}
.q .opts button.right{background:var(--go-soft);border-color:var(--go)}
.q .opts button.wrong{background:var(--stop-soft);border-color:var(--stop)}
.q .why{font-size:.88rem;color:var(--muted)}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.checklist{display:flex;flex-direction:column;gap:8px}
.checklist label{flex-direction:row;align-items:flex-start;gap:10px;color:var(--fg);font-size:.9rem;font-weight:400}
.checklist input{margin-top:4px}
.checklist small{display:block;color:var(--muted)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.85rem}
.payoff svg{width:100%;height:auto;display:block}
.payoff .axis{stroke:var(--line)} .payoff .zero{stroke:var(--muted);stroke-dasharray:4 4}
.payoff .line{stroke:var(--accent);fill:none;stroke-width:2.5}
.payoff text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.payoff .gain{fill:var(--go-soft)} .payoff .loss{fill:var(--stop-soft)}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20}
.muted{color:var(--muted)} .small{font-size:.82rem}
.disclaimer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:80ch}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{padding-bottom:8px} .side .foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap} .nav .count{display:none}
  .lessons,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .lesson-list{position:static}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:no-preference){.nav button,.q .opts button,.btn{transition:background .15s,border-color .15s}}
</style>

function suggestRegime(){const s=MK('SPX'),n=MK('NASDAQ');if(!s||!n||!s.distDays)return null;const dd=Math.max(s.distDays.length,n.distDays.length);const below=(s.ma50&&s.price<s.ma50)||(n.ma50&&n.price<n.ma50);const fall=Math.min(s.drawdown,n.drawdown)<=-.08;let k,why;
 if(fall&&below){k='correction';why='an index is 8% or more below its high and below its 50-day line'}
 else if(dd>=6||(below&&dd>=4)){k='correction';why=dd+' distribution days'+(below?' and an index below its 50-day line':'')}
 else if(dd>=4||below||fall){k='pressure';why=(dd>=4?dd+' distribution days':'')+(below?(dd>=4?' and ':'')+'an index below its 50-day line':'')+(fall&&!below?(dd>=4?', ':'')+'Nasdaq or S&P more than 8% off its high':'')}
 else{k='uptrend';why='few distribution days and both indexes above their 50-day lines'}
 return{k,why,dd}}

const LESSONS=[
{m:'1. Option basics',id:'what',t:'What is an option?',b:`
<p>An option is a <b>contract</b> between two people about a stock (or an index).</p>
<ul><li>The <b>buyer</b> pays money now and gets a <b>right</b>: to buy or sell the stock at a fixed price, until a fixed date.</li>
<li>The <b>seller</b> (also called the <i>writer</i>) receives that money now and takes on an <b>obligation</b>: to do the deal if the buyer wants it.</li></ul>
<p>The money the buyer pays is the <b>premium</b>. This app is about being the seller: you collect the premium, like an insurance company collects insurance payments.</p>
<div class="tip"><b>Insurance picture.</b> When you sell a put, you insure someone else's shares against a fall. You get the premium. Most months nothing happens and you keep it. Sometimes there is a "storm" and you must pay out. Your job is to sell insurance only in good weather, on good houses, and never too much of it.</div>`,
q:[{q:'You sell an option. What do you receive and what do you take on?',o:['A right, and you pay a premium','The premium, and you take on an obligation','Shares, and you pay a fee'],a:1,w:'The seller receives the premium and must do the deal if the buyer asks.'},
{q:'Who decides whether the option is used (exercised)?',o:['The buyer','The seller','The broker'],a:0,w:'The buyer owns the right. The seller must follow.'}]},
{m:'1. Option basics',id:'callput',t:'Calls and puts',b:`
<p>There are two kinds of options:</p>
<ul><li><b>Call</b> = the right to <b>buy</b> the stock at the strike price. Buyers of calls hope the stock goes <i>up</i>.</li>
<li><b>Put</b> = the right to <b>sell</b> the stock at the strike price. Buyers of puts hope the stock goes <i>down</i> (or want protection).</li></ul>
<p>So there are four positions. As a premium collector, you use only two of them:</p>
<div class="tablewrap"><table><thead><tr><th>Position</th><th>You…</th><th>Used here?</th></tr></thead><tbody>
<tr><td>Buy a call</td><td>pay premium, hope for a rise</td><td>No</td></tr>
<tr><td>Buy a put</td><td>pay premium, hope for a fall / protection</td><td>Only as the safety leg of a spread</td></tr>
<tr><td><b>Sell a put</b></td><td>get premium, may have to <b>buy</b> the stock at the strike</td><td><b>Yes – main strategy</b></td></tr>
<tr><td><b>Sell a call</b></td><td>get premium, may have to <b>sell</b> the stock at the strike</td><td><b>Yes – only if you own the shares (covered)</b></td></tr>
</tbody></table></div>`,
q:[{q:'You sell a put on ING with strike €20. ING falls to €17 at expiry. What happens?',o:['Nothing, you keep the premium','You probably have to buy ING at €20','You have to sell ING at €20'],a:1,w:'The put buyer will sell to you at €20, because the market price is lower. You keep the premium, which lowers your real buy price.'},
{q:'Why do we only sell calls on shares we already own?',o:['Because it is cheaper','Because a "naked" call has no limit on the loss if the stock rockets up','Because DEGIRO forbids all calls'],a:1,w:'A stock can rise without limit. If you must deliver shares you do not own, your loss has no ceiling.'}]},
{m:'1. Option basics',id:'terms',t:'Strike, expiry, premium, contract size',b:`
<ul><li><b>Strike</b>: the fixed price in the contract.</li>
<li><b>Expiry</b>: the last day of the contract. In Europe, monthly options usually stop trading on the third Friday of the month.</li>
<li><b>Premium</b>: the price of the option, shown <i>per share</i>.</li>
<li><b>Contract size (multiplier)</b>: how many shares one contract covers. For most stock options on Euronext Amsterdam and Eurex this is 100 shares, but always check it in DEGIRO.</li></ul>
<div class="tip"><b>Example.</b> A put on Shell, strike €30, premium €0.60, contract size 100.<br>You receive 0.60 × 100 = <b>€60</b> per contract.<br>Your obligation is 30 × 100 = <b>€3,000</b>: you must be able to pay that if you are assigned.</div>
<p>The obligation (strike × contract size) is the most important number for a defensive trader. In this app we always keep enough cash to pay it. That is called a <b>cash-secured put</b>.</p>`,
q:[{q:'Put on a €80 stock, strike €75, premium €1.50, size 100. How much cash should you keep aside?',o:['€150','€7,500','€8,000'],a:1,w:'Strike × size = 75 × 100 = €7,500. You receive €150 premium.'},
{q:'A premium of €0.45 on a 100-share contract pays you…',o:['€0.45','€4.50','€45'],a:2,w:'Premium is per share: 0.45 × 100 = €45 (minus fees).'}]},
{m:'1. Option basics',id:'chain',t:'Reading an option chain',b:`
<p>An <b>option chain</b> is the list of all options on one underlying. In DEGIRO, on Euronext and on Eurex it looks roughly like this:</p>
<div class="tablewrap"><table><thead><tr><th class="n">Call bid</th><th class="n">Call ask</th><th class="n">Strike</th><th class="n">Put bid</th><th class="n">Put ask</th></tr></thead><tbody>
<tr><td class="n">2.05</td><td class="n">2.15</td><td class="n"><b>30</b></td><td class="n">0.55</td><td class="n">0.62</td></tr>
<tr><td class="n">1.30</td><td class="n">1.38</td><td class="n"><b>31</b></td><td class="n">0.80</td><td class="n">0.88</td></tr>
<tr><td class="n">0.78</td><td class="n">0.84</td><td class="n"><b>32</b></td><td class="n">1.25</td><td class="n">1.34</td></tr></tbody></table></div>
<p class="small muted">Example numbers for a stock at about €31.50, one expiry.</p>
<ul><li>You choose the <b>expiry</b> first (a tab or drop-down). Each expiry has its own chain.</li>
<li><b>Calls on the left, puts on the right</b>, strikes in the middle.</li>
<li><b>Bid</b> = what buyers pay now. When you <i>sell</i>, you get about the bid. <b>Ask</b> = what sellers want. The <b>middle</b> is a fair starting price for your limit order.</li>
<li>Higher strike → calls get cheaper, puts get more expensive.</li>
<li>A small gap between bid and ask means a liquid option. A big gap costs you money.</li>
<li>Also look at <b>volume</b> (traded today) and <b>open interest</b> (contracts open). More is better.</li></ul>
<p>Practise with the <b>Option finder</b>: it shows estimated premiums for every strike and expiry, and turns a real DEGIRO bid/ask into implied volatility and delta.</p>`,
q:[{q:'You want to sell the 30 put above. Your limit order should start around…',o:['0.55','0.58–0.59','0.62'],a:1,w:'The middle between bid 0.55 and ask 0.62 is about 0.585. Start there; lower slowly if it does not fill.'},
{q:'As the strike goes up, a put becomes…',o:['Cheaper','More expensive'],a:1,w:'A higher put strike is closer to (or above) the price, so it is worth more.'}]},
{m:'1. Option basics',id:'money',t:'In, at and out of the money',b:`
<p>For a <b>put</b>:</p>
<ul><li><b>Out of the money (OTM)</b>: the stock is <i>above</i> the strike. If it stays there, the put expires worthless and you keep all the premium. This is what we want.</li>
<li><b>At the money (ATM)</b>: stock ≈ strike.</li>
<li><b>In the money (ITM)</b>: the stock is <i>below</i> the strike. You will probably have to buy the shares.</li></ul>
<p>The premium has two parts: <b>intrinsic value</b> (how much it is in the money) and <b>time value</b> (everything else). An OTM option is 100% time value, and time value melts to zero at expiry. That melting is your income.</p>`,
q:[{q:'Stock at €50, you sold a €45 put. The put is…',o:['In the money','Out of the money','At the money'],a:1,w:'For a put, OTM means the stock is above the strike.'},
{q:'What part of an OTM option\'s premium is time value?',o:['None','About half','All of it'],a:2,w:'An OTM option has no intrinsic value, so all of it is time value, which disappears by expiry.'}]},
{m:'1. Option basics',id:'assign',t:'Exercise and assignment',b:`
<ul><li><b>Exercise</b>: the buyer uses the right.</li>
<li><b>Assignment</b>: you, the seller, are picked to fulfil the contract. With a put, the shares are bought for you; with a covered call, your shares are sold.</li>
<li><b>American style</b> (most single-stock options on Euronext and Eurex): the buyer can exercise on any trading day. So you can be assigned early, especially just before an ex-dividend date.</li>
<li><b>European style</b> (index options such as AEX and Euro Stoxx 50): exercise only at expiry. Index options are <b>cash-settled</b>: no shares change hands, you just pay or receive the difference.</li></ul>
<div class="warnbox">With a cash-settled index put, being "assigned" means paying cash, not getting shares. There is no "wheel" with index options: you take the loss.</div>`,
q:[{q:'You sold a put on the AEX index and it ends in the money. What happens?',o:['You receive AEX shares','The difference is settled in cash','Nothing'],a:1,w:'AEX and Euro Stoxx 50 options are cash-settled.'},
{q:'When is early assignment on a covered call most likely?',o:['Right before an ex-dividend date','On Mondays','Never'],a:0,w:'The call buyer exercises early to get the dividend, if the call is in the money.'}]},
{m:'2. How option prices move',id:'theta',t:'Time decay (theta): your friend',b:`
<p>Every day, an option loses a bit of its time value. This is called <b>theta</b>. For a seller, theta is income.</p>
<ul><li>Decay is slow far from expiry and fast in the last weeks.</li>
<li>Many premium sellers open trades <b>30 to 45 days</b> before expiry. That is a good balance between a decent premium and fast enough decay.</li>
<li>In the last 1–2 weeks, decay is fastest, but price swings (gamma) are biggest too. So we usually close or roll around <b>21 days</b> left.</li></ul>`,
q:[{q:'When does time decay go fastest?',o:['Right after you open','In the last weeks before expiry','It is always the same'],a:1,w:'Decay accelerates near expiry.'},
{q:'Why not always sell 1-week options for fast decay?',o:['They are illegal','Small price moves can quickly push them in the money','They have no premium'],a:1,w:'Short-dated options react very strongly to price moves (high gamma). That is risk, not safety.'}]},
{m:'2. How option prices move',id:'delta',t:'Delta: a rough chance',b:`
<p><b>Delta</b> tells how much the option price moves when the stock moves €1. For sellers there is a handy rule of thumb:</p>
<div class="tip">Delta ≈ the chance that the option ends <b>in the money</b>.<br>A put with delta 0.20 has very roughly a 20% chance of ending in the money, and an 80% chance of expiring worthless.</div>
<ul><li>Lower delta = further from the price = safer, but less premium.</li>
<li>This plan uses <b>0.15 – 0.25</b> in a good market and lower when the market is weaker.</li>
<li>DEGIRO's option chain does not always show Greeks. You can use the distance instead: for a normal stock with 30–45 days, a delta 0.20 put is often about 5–10% below the price. Volatile stocks need more distance.</li></ul>`,
q:[{q:'A put with delta 0.15 has about what chance of ending in the money?',o:['85%','15%','50%'],a:1,w:'Rule of thumb: delta ≈ probability of ending ITM.'},
{q:'Moving your strike further from the price does what?',o:['More premium, more risk','Less premium, less risk','Nothing'],a:1,w:'Further OTM = lower delta = smaller premium and smaller chance of trouble.'}]},
{m:'2. How option prices move',id:'iv',t:'Implied volatility, VSTOXX and VIX',b:`
<p><b>Implied volatility (IV)</b> is the market's guess of how much a stock will move. High IV = expensive options = bigger premiums for sellers.</p>
<ul><li><b>VSTOXX</b> is the "fear index" for Euro Stoxx 50. <b>VIX</b> is the same for the S&amp;P 500. Around 12–20 is calm, above 30 is panic.</li>
<li>IV jumps when markets fall. That is exactly when premiums look most tempting.</li></ul>
<div class="stopbox"><b>The big trap.</b> High premium is not free money. It is high because the market expects big moves, often down. O'Neil's rule says: in a correction, do not buy. Selling a put is agreeing to buy. So in a correction we do not sell puts, however juicy they look.</div>
<p>The sweet spot for this plan: a <b>pullback inside a confirmed uptrend</b>, or the first weeks after a follow-through day. IV is a bit higher, but the trend is still up.</p>`,
q:[{q:'VSTOXX jumps to 35 during a sell-off. According to this plan you…',o:['Sell as many puts as possible','Open no new short puts and wait','Buy calls'],a:1,w:'Panic-level volatility = no new short puts. Wait for calm and a confirmed uptrend.'},
{q:'What is the best moment to sell puts in this plan?',o:['In a market correction, when premiums are highest','During a pullback in a confirmed uptrend','The day before earnings'],a:1,w:'Premium is slightly higher and the trend is still on your side.'}]},
{m:'3. Premium strategies',id:'csp',t:'Cash-secured put',b:`
<p><b>What:</b> you sell a put below the current price and keep enough cash to buy the shares.</p>
<p><b>You win if:</b> the stock stays above the strike. You keep the premium.</p>
<p><b>If it falls below the strike:</b> you buy the shares at the strike. Your real price is <b>strike − premium</b> (the break-even).</p>
<p><b>Biggest risk:</b> a large fall. If the stock drops 40%, you lose almost the same as someone who bought the stock, minus the small premium.</p>
<div class="tip"><b>Golden rule:</b> only sell a put on a stock you would be happy to buy at that strike, in a market where O'Neil would be buying.</div>
<p>Open the <b>Calculator</b> to see the payoff picture and the numbers.</p>`,
q:[{q:'Strike €40, premium €1.20. Your break-even is…',o:['€41.20','€38.80','€40.00'],a:1,w:'Break-even = strike − premium = 40 − 1.20 = €38.80.'},
{q:'What makes a put "cash-secured"?',o:['You keep cash equal to strike × contract size','You use margin','You buy a call too'],a:0,w:'You can always pay for the shares without borrowing.'}]},
{m:'3. Premium strategies',id:'cc',t:'Covered call',b:`
<p><b>What:</b> you own at least 100 shares (per contract) and sell a call above the price.</p>
<ul><li>You get premium now.</li>
<li>If the stock rises above the strike, your shares are sold at the strike. You miss the gains above it.</li>
<li>The premium gives a small cushion if the stock falls, but it is <b>not</b> real protection.</li></ul>
<p><b>O'Neil view:</b> in a strong uptrend, your best stocks can rise 20–100%. Capping them with calls is often a mistake. Covered calls fit better in a choppy or weak market, on stocks you hold for the long term.</p>
<div class="warnbox">Never sell a call with a strike below what you paid for the shares (your cost basis), unless you are happy to lock in a loss.</div>`,
q:[{q:'You own 100 Unilever at €50 and sell a €55 call for €0.80. Unilever goes to €62. Result?',o:['Shares sold at €55, you keep €80 premium','You keep the shares and the gain to €62','You lose money'],a:0,w:'Your shares are called away at €55. Profit = (55−50)×100 + 80 = €580. You miss the move to €62.'},
{q:'In which market are covered calls most useful?',o:['A powerful new uptrend','A sideways or weak market','Never'],a:1,w:'In a strong uptrend they cap your winners. In a flat market they add income.'}]},
{m:'3. Premium strategies',id:'wheel',t:'The wheel, with O\'Neil brakes',b:`
<p>The wheel is a cycle:</p>
<ol><li>Sell a cash-secured put.</li><li>If assigned, you own the shares.</li><li>Sell covered calls above your cost until the shares are called away.</li><li>Start again with a put.</li></ol>
<p>The danger of the normal wheel: a stock that keeps falling. People hold it for months "selling calls" while it loses 30–50%.</p>
<div class="stopbox"><b>O'Neil brake.</b> O'Neil cut every loss at 7–8% below the purchase price, no exceptions. In this plan: if you are assigned and the stock closes about 8% below your break-even, or breaks its 50-day line on heavy volume and cannot recover, <b>sell the shares</b>. Do not keep wheeling a broken stock.</div>`,
q:[{q:'You were assigned at break-even €38.80. The stock is now €35.50. What does the O\'Neil brake say?',o:['Sell covered calls and wait','Sell the shares: it is more than 8% below break-even','Buy more'],a:1,w:'35.50 is 8.5% below 38.80. Cut the loss.'},
{q:'Why add a stop to the wheel?',o:['To pay more fees','A falling stock can cost far more than the premiums earn','DEGIRO requires it'],a:1,w:'Small premiums cannot repair a large loss.'}]},
{m:'3. Premium strategies',id:'spread',t:'Put credit spread: a fixed maximum loss',b:`
<p>A put credit spread is two orders at the same expiry:</p>
<ul><li><b>Sell</b> a put (e.g. strike 95).</li><li><b>Buy</b> a cheaper put lower (e.g. strike 90) as insurance.</li></ul>
<p>You receive less premium, but your maximum loss is limited to: <b>(difference between strikes × contract size) − premium received</b>.</p>
<p>This is the most defensive way to collect premium when the market is not perfect, and it needs much less cash than a cash-secured put. It also works well with index options (Mini AEX, Euro Stoxx 50).</p>
<div class="warnbox">At DEGIRO you may have to enter the two legs as two separate orders. Always buy the protective put first or at the same moment, so you are never left with only the short put.</div>`,
q:[{q:'Spread 95/90 on Euro Stoxx 50 options (€10 per point), credit 1.5 points. Maximum loss?',o:['€15','€35','€50'],a:1,w:'Width 5 points × €10 = €50, minus credit 1.5 × €10 = €15 → max loss €35.'},
{q:'Why use a spread instead of a single short put?',o:['More premium','A known, limited maximum loss','No fees'],a:1,w:'The bought put caps the loss.'}]},
{m:'3. Premium strategies',id:'risks',t:'What can go wrong',b:`
<ul><li><b>Gap down:</b> bad news overnight. The stock opens 20% lower. Your stop cannot help. Defence: small positions, no trades across earnings.</li>
<li><b>Too many puts at once:</b> in a crash, all stocks fall together. Defence: cap the total obligation (see the Plan).</li>
<li><b>Chasing premium:</b> picking volatile stocks because they pay more. Defence: annual return above ~30% on a put is a red flag.</li>
<li><b>Margin:</b> at DEGIRO, short options use your "free space". If markets fall, required margin can rise sharply. Defence: never use the margin; keep cash.</li>
<li><b>Currency:</b> options on non-euro stocks add currency risk. Defence: stay with euro underlyings.</li>
<li><b>Fees and spread:</b> on cheap options, a €1–2 fee plus a wide bid/ask can eat much of the premium.</li></ul>
<div class="stopbox">Selling options gives many small wins and a few large losses. The plan exists to keep those losses small.</div>`,
q:[{q:'A put that pays 45% a year in premium usually means…',o:['A great deal','Very high risk','No risk'],a:1,w:'High premium = high expected movement.'},
{q:'Best defence against a gap down after earnings?',o:['Tight stop-loss','Not holding short puts across the earnings date','Selling more puts'],a:1,w:'A stop cannot fill at your price when the stock opens far lower.'}]},
{m:'4. O\'Neil & IBD',id:'canslim',t:'CAN SLIM in plain words',b:`
<p>William O'Neil studied the biggest winning stocks over many decades and found seven common traits. He called them CAN SLIM:</p>
<div class="tablewrap"><table><thead><tr><th>Letter</th><th>Means</th><th>What to look for</th></tr></thead><tbody>
<tr><td><b>C</b></td><td>Current earnings</td><td>Latest quarter earnings per share up 25% or more</td></tr>
<tr><td><b>A</b></td><td>Annual earnings</td><td>Strong growth over the last 3 years</td></tr>
<tr><td><b>N</b></td><td>New</td><td>New product, new management, new highs in price</td></tr>
<tr><td><b>S</b></td><td>Supply and demand</td><td>Price rises on high volume</td></tr>
<tr><td><b>L</b></td><td>Leader or laggard</td><td>Be in the leader. Relative Strength rating 80+</td></tr>
<tr><td><b>I</b></td><td>Institutional sponsorship</td><td>Good funds are buying</td></tr>
<tr><td><b>M</b></td><td>Market direction</td><td>Only buy in a confirmed uptrend</td></tr>
</tbody></table></div>
<p>For premium selling, the most useful letters are <b>M</b> (when) and <b>L</b> (which stock). A put on a leader in an uptrend has the wind behind it.</p>`,
q:[{q:'Which CAN SLIM letter tells you WHEN to sell puts?',o:['C','L','M'],a:2,w:'M = market direction.'},
{q:'O\'Neil prefers stocks that are…',o:['Near their lows, cheap','Near new highs, leading','Flat for years'],a:1,w:'He bought strength, not bargains.'}]},
{m:'4. O\'Neil & IBD',id:'market',t:'Reading the market like IBD',b:`
<p>IBD labels the market in one of three states (its "Market Pulse"):</p>
<ul><li><b>Confirmed uptrend</b>: buy.</li><li><b>Uptrend under pressure</b>: be careful.</li><li><b>Market in correction</b>: no new buys.</li></ul>
<p>Two tools decide the state:</p>
<h3>Distribution days</h3>
<p>A day when a major index (S&amp;P 500, Nasdaq) falls about 0.2% or more on <b>higher volume</b> than the day before. That is big funds selling. A distribution day drops out of the count after 25 trading days, or when the index rises 5% above that day's close. Around 5–6 of them in a few weeks often means trouble.</p>
<h3>Follow-through day</h3>
<p>After a correction, the market tries to bounce (a "rally attempt"). On day 4 or later, a strong gain on higher volume is a follow-through day. It signals a new uptrend may be starting. IBD has used different minimum gains over the years (from roughly 1.2% to 1.7% or more).</p>
<div class="tip">O'Neil found that about <b>3 out of 4 stocks follow the general market</b>. So even a great stock is hard to own in a bad market. Use the helper on the Today page to check the state.</div>`,
q:[{q:'The index falls 0.6% on lower volume than yesterday. Distribution day?',o:['Yes','No'],a:1,w:'Volume must be higher than the day before.'},
{q:'A follow-through day can happen on…',o:['Day 1 of the rally attempt','Day 4 or later','Only on Fridays'],a:1,w:'Day 4 or later, on a strong gain with higher volume.'}]},
{m:'4. O\'Neil & IBD',id:'leaders',t:'Leaders, bases and the 50-day line',b:`
<ul><li><b>Base</b>: a sideways period (often a "cup with handle") where a stock rests before a new move. The breakout point is the <b>pivot</b>.</li>
<li><b>50-day moving average</b>: leaders often bounce off this line during an uptrend. A pullback to it on <b>low volume</b> is a classic spot to sell a put, with the strike below the line.</li>
<li><b>Sell signal</b>: breaking the 50-day line on <b>heavy volume</b> and staying below it. Then close puts on that stock.</li>
<li><b>7–8% rule</b>: O'Neil cut any stock that fell 7–8% below his purchase price. We use the same idea for assigned shares.</li></ul>`,
q:[{q:'A leader pulls back to its 50-day line on light volume in a confirmed uptrend. For this plan this is…',o:['A good spot to sell a put below the line','A sell signal','Irrelevant'],a:0,w:'Quiet pullbacks to support in an uptrend are the ideal moment.'},
{q:'The stock breaks the 50-day line on very heavy volume. You have a short put on it. You…',o:['Sell another put','Consider closing the put','Wait for expiry'],a:1,w:'Heavy-volume breaks of support are warnings. Defend first.'}]},
{m:'4. O\'Neil & IBD',id:'combine',t:'Combining O\'Neil with premium selling',b:`
<p>O'Neil bought breakouts. A put seller does something slightly different: <b>gets paid to wait</b> for a lower buy price on a leader.</p>
<div class="tablewrap"><table><thead><tr><th>O'Neil rule</th><th>Premium-seller version</th></tr></thead><tbody>
<tr><td>Only buy in a confirmed uptrend (M)</td><td>Only sell new puts in a confirmed (or new) uptrend</td></tr>
<tr><td>Buy leaders (L, RS 80+)</td><td>Sell puts only on leaders or on the index</td></tr>
<tr><td>Buy near support / from a base</td><td>Strike below the 50-day line or the bottom of the base</td></tr>
<tr><td>Cut losses at 7–8%</td><td>Close the put at 2× premium, or sell assigned shares 8% below break-even</td></tr>
<tr><td>Raise cash in a correction</td><td>No new puts; let open trades expire or close them</td></tr>
<tr><td>Avoid earnings surprises (pyramid carefully)</td><td>No short options across earnings dates</td></tr>
</tbody></table></div>`,
q:[{q:'In this plan, where should the strike usually be?',o:['Above the current price','Below support such as the 50-day line','Exactly at the price'],a:1,w:'Below support gives extra safety.'}]},
{m:'5. Risk & DEGIRO',id:'sizing',t:'Position sizing: the defensive rulebook',b:`
<ul><li><b>Cash-secured only:</b> total obligation of all short puts ≤ your cash. Never rely on margin.</li>
<li><b>Market cap on total obligation:</b> max 60% of the account in a confirmed uptrend, 30% under pressure or just after a follow-through, 0% in a correction.</li>
<li><b>Per position:</b> max 20% of the account (10% in weaker markets).</li>
<li><b>Sectors:</b> max 2 positions per sector.</li>
<li><b>Number:</b> max 5 open positions while you are learning.</li></ul>
<p>Example: €50,000 account, confirmed uptrend → max €30,000 total obligation, max €10,000 per put. A €95 strike × 100 = €9,500 is just inside the limit. A €700 ASML strike × 100 = €70,000 is far too big.</p>`,
q:[{q:'€30,000 account, uptrend under pressure. Max obligation per position?',o:['€3,000','€6,000','€18,000'],a:0,w:'10% of €30,000 = €3,000 in a market under pressure.'}]},
{m:'5. Risk & DEGIRO',id:'manage',t:'Managing a trade',b:`
<ol><li><b>Take profit at 50%.</b> Sold for €1.00? Place a buy order at €0.50 right after opening. You free the cash and lower risk.</li>
<li><b>21 days left:</b> close or roll. Little premium is left compared with the risk.</li>
<li><b>Defensive exit (stop):</b> buy back if the option price reaches <b>2× what you received</b> (loss ≈ 1× premium), or if the stock breaks its 50-day line on heavy volume.</li>
<li><b>Rolling:</b> buying back and selling a later expiry (and if possible a lower strike) for a <i>net credit</i>. Only roll if the stock still passes your checklist and the market is still in an uptrend. Never roll just to avoid admitting a loss.</li>
<li><b>Market turns to correction:</b> no new trades; close the weakest positions.</li></ol>`,
q:[{q:'You sold a put for €1.20. Where is your profit target and your stop?',o:['Buy back at €0.60 / €2.40','Buy back at €0.10 / €5.00','No target, hold to expiry'],a:0,w:'50% profit = €0.60. Stop at 2× = €2.40.'}]},
{m:'5. Risk & DEGIRO',id:'degiro',t:'Trading options at DEGIRO',b:`
<p>See the <b>DEGIRO</b> section for the step-by-step guide. Key points:</p>
<ul><li>You need an account profile that allows options (reviews mention "Active" or "Trader"), and DEGIRO will likely ask you to pass a knowledge test for derivatives.</li>
<li>Reviews say DEGIRO offers European options (Euronext, Eurex) and US <i>index</i> options, but <b>not options on single US stocks</b>. That is why this app uses European stocks.</li>
<li>Selling an option you do not own opens a short position, which uses margin ("free space"). DEGIRO does not check that it is cash-secured: <b>you</b> must keep the cash aside.</li>
<li>Always use <b>limit orders</b>, never market orders on options.</li></ul>`,
q:[{q:'Who makes sure your puts at DEGIRO are cash-secured?',o:['DEGIRO automatically','You yourself','The exchange'],a:1,w:'DEGIRO only checks margin. Keeping full cash aside is your own rule.'},
{q:'Which order type should you use for options?',o:['Market order','Limit order'],a:1,w:'Option spreads can be wide; a market order can fill at a bad price.'}]}
];

 $('#nav').innerHTML=VIEWS.map(([id,l])=>`<button data-v="${id}" ${cur===id?'aria-current="page"':''}>${l}${id==='learn'?`<span class="count">${n}/${LESSONS.length}</span>`:id==='journal'?`<span class="count">${j}</span>`:''}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));

const R={};
const disclaimer=`<p class="disclaimer">Premium Coach is a learning tool, not financial advice. Options can lose more than the premium you receive. Check every number, contract size and fee in DEGIRO before you trade, and consider paper-trading this plan for a few months first.</p>`;

R.today=()=>{
 const r=REGIMES[S.regime],v=VOL[S.vol];
 const mult=r.maxObl?v.mult:0;
 const tone=mult===0&&r.maxObl>0?'stop':(v.mult<1&&r.tone==='go'?'warn':r.tone);
 const big=mult===0&&r.maxObl>0?'Red light: volatility is at panic level. Wait.':r.big;
 $('#main').innerHTML=`<div class="view">
 <div class="stack"><span class="eyebrow">Today's decision</span><h1>Should I sell premium right now?</h1>
 <p class="lede">Set the market state (from IBD's Market Pulse, or with the helper below) and today's volatility. The plan updates itself.</p></div>
 ${liveMarketCard()}
 <div class="card stack">
  <h3>1. Market state</h3>
  <div class="seg" id="segR">${Object.entries(REGIMES).map(([k,x])=>`<button aria-pressed="${k===S.regime}" data-k="${k}">${x.name}</button>`).join('')}</div>
  <h3 style="margin-top:8px">2. Volatility (VSTOXX for Europe, or VIX)</h3>
  <div class="seg" id="segV">${Object.entries(VOL).map(([k,x])=>`<button aria-pressed="${k===S.vol}" data-k="${k}">${x.name}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><label>3. Account size (€)<input id="acct" type="number" min="0" step="1000" value="${S.account}"></label></div>
 </div>
 <div class="verdict ${tone}"><span class="eyebrow">${r.name} · ${v.name.split(' (')[0]} volatility</span><span class="big">${big}</span><p>${r.oneil}</p><p class="small">${v.note}</p></div>
 <div class="kv">
  <div><span>Max total put obligation</span><b>${eur(S.account*r.maxObl*mult)}</b></div>
  <div><span>Max per position</span><b>${eur(S.account*r.maxPos*(mult||0))}</b></div>
  <div><span>Target delta</span><b>${mult?r.delta:'–'}</b></div>
  <div><span>Days to expiry</span><b>${mult?r.dte:'–'}</b></div>
 </div>
 <div class="card stack"><h3>What to do now</h3><ul class="prose" style="padding-left:1.2em;margin:0">${r.actions.map(a=>`<li>${a}</li>`).join('')}</ul></div>
 <div class="stack"><h2>When is each strategy allowed?</h2>
 <p class="lede">This answers the key question: selling puts belongs in a bull market, best during a pullback. In a correction you stop, even though premiums look biggest then.</p>
 <div class="tablewrap"><table class="matrix"><thead><tr><th>Market state</th><th>Short put on a stock</th><th>Short put on index</th><th>Put credit spread</th><th>Covered call</th><th>Sit in cash</th></tr></thead><tbody>
 ${Object.entries(REGIMES).map(([k,x])=>`<tr ${k===S.regime?'style="background:var(--accent-soft)"':''}><td><b>${x.name}</b></td>${['putsStock','putsIndex','spread','cc','cash'].map(f=>`<td><span class="chip ${x[f]}">${CHIP[x[f]]}</span></td>`).join('')}</tr>`).join('')}
 </tbody></table></div></div>
 <div class="card stack"><h3>Helper: which market state are we in?</h3>
 <p class="small muted">Use this if you do not have IBD. Look at the S&amp;P 500 or Nasdaq (they lead world markets) and the Euro Stoxx 50 or AEX. IBD's own label is better when you have it.</p>
 <div class="form">
  <label>Distribution days in the last 25 sessions<input id="hDD" type="number" min="0" max="15" value="${store.get('hDD',3)}"></label>
  <label>Index vs. its 50-day line<select id="h50"><option value="above">Above</option><option value="below">Below</option></select></label>
  <label>Index fell 8%+ from its high recently?<select id="hFall"><option value="no">No</option><option value="yes">Yes</option></select></label>
  <label>Since the low: follow-through day?<select id="hFTD"><option value="na">Not relevant (no recent low)</option><option value="no">No, still a rally attempt</option><option value="yes">Yes, in the last 3 weeks</option></select></label>
 </div>
 <div class="row"><button class="btn primary" id="hGo">Suggest state</button><span id="hOut" class="small"></span></div></div>
 <div class="card stack"><h3>Weekly routine (about 30 minutes, at the weekend)</h3>
 <ol class="steps">
  <li><div><b>Read the market.</b> IBD's Market Pulse / The Big Picture, or the helper above. Count distribution days.</div></li>
  <li><div><b>Check open positions.</b> Any at 50% profit? Any at the stop (2× premium)? Any with 21 days left? Earnings coming?</div></li>
  <li><div><b>Update the watchlist.</b> Run the Stocks checklist on 3–5 candidates.</div></li>
  <li><div><b>Plan new trades</b> only if today's light is green or yellow-green. Write the strike, premium and exits in the Journal before you place the order.</div></li>
 </ol></div>
 ${disclaimer}</div>`;
 bindLive();
 $('#segR').onclick=e=>{const k=e.target.dataset.k;if(k){S.regime=k;saveS();R.today()}};
 $('#segV').onclick=e=>{const k=e.target.dataset.k;if(k){S.vol=k;saveS();R.today()}};
 $('#acct').onchange=e=>{S.account=Math.max(0,+e.target.value||0);saveS();R.today()};
 $('#hGo').onclick=()=>{const dd=+$('#hDD').value||0;store.set('hDD',dd);const b50=$('#h50').value,fall=$('#hFall').value,ftd=$('#hFTD').value;let k,why;
  if(fall==='yes'&&ftd==='no'){k='rally';why='The index fell hard and has not had a follow-through day yet.'}
  else if(fall==='yes'&&ftd==='yes'){k='newup';why='A follow-through day after a drop: a new uptrend, start small.'}
  else if(dd>=6||(b50==='below'&&dd>=4)){k='correction';why='Many distribution days and/or the index below its 50-day line.'}
  else if(dd>=4||b50==='below'){k='pressure';why='Distribution is building or the index lost its 50-day line.'}
  else{k='uptrend';why='Few distribution days and the index holds above its 50-day line.'}
  $('#hOut').innerHTML=`Suggestion: <b>${REGIMES[k].name}</b>. ${why} <button class="btn small" id="hUse">Use this</button>`;
  $('#hUse').onclick=()=>{S.regime=k;saveS();R.today();toast('Market state updated')}};
};

function liveMarketCard(){if(!LIVE||!MK('SPX'))return '';const sg=suggestRegime();const vix=MK('VIX');const vc=volClass(vix&&vix.price);
 const row=(k,name)=>{const m=MK(k);if(!m)return '';const a50=m.ma50?m.price/m.ma50-1:null;return `<tr><td><b>${name}</b></td><td class="n">${m.price.toLocaleString('en-GB',{maximumFractionDigits:2})}</td><td class="n" style="color:${a50==null?'inherit':a50>=0?'var(--go)':'var(--stop)'}">${a50==null?'–':(a50>=0?'+':'')+pct(a50)}</td><td class="n">${m.distDays?m.distDays.length:'–'}</td><td class="n">${m.high52?pct(m.price/m.high52-1):'–'}</td></tr>`};
 return `<div class="card stack"><div class="row" style="justify-content:space-between"><h3>Live market check</h3><span class="small muted">Data from ${fmtTime(LIVE.generated)} · Yahoo Finance</span></div>
 <div class="tablewrap"><table><thead><tr><th>Index</th><th class="n">Level</th><th class="n">vs 50-day line</th><th class="n">Distribution days (25 sessions)</th><th class="n">From 52-week high</th></tr></thead><tbody>
 ${row('SPX','S&P 500')}${row('NASDAQ','Nasdaq Composite')}${row('SX5E','Euro Stoxx 50')}${row('AEXI','AEX')}</tbody></table></div>
 ${vix?`<p class="small">VIX (US fear index): <b class="mono">${vix.price.toFixed(1)}</b> → ${VOL[vc].name}. VSTOXX is usually close to it; check it on the Websites page.</p>`:''}
 ${sg?`<div class="row"><span>Suggested by the numbers: <b>${REGIMES[sg.k].name}</b>, because of ${sg.why}.</span><button class="btn small primary" id="useLive">Use this${vc?' and the VIX level':''}</button></div>
 <p class="small muted">Distribution days are counted the IBD way on the S&P 500 and Nasdaq (down 0.2% or more on higher volume, dropped after 25 sessions or a 5% rally). IBD's own call can differ, because it also looks at leading stocks and judgement. When you have IBD, its Market Pulse wins.</p>`:''}</div>`}
function bindLive(){const b=$('#useLive');if(!b)return;b.onclick=()=>{const sg=suggestRegime();S.regime=sg.k;const vc=volClass(MK('VIX')&&MK('VIX').price);if(vc)S.vol=vc;saveS();R.today();toast('Market state set from live data')}}

R.calc=()=>{
 const r=REGIMES[S.regime],v=VOL[S.vol];
 $('#main').innerHTML=`<div class="view">
 <div class="stack"><span class="eyebrow">Calculator</span><h1>${C.mode==='put'?'Cash-secured put':'Covered call'}</h1>

   const maxPos=S.account*r.maxPos*(r.maxObl?v.mult:0);

    [fees<gross*.15,'Fees are less than 15% of the premium',`Fees ${eur2(fees)} of ${eur2(gross)}`]];

 out();
};
function payoff(kind,price,strike,prem,q,basis){
 const W=640,H=220,P={l:58,r:16,t:16,b:30};const lo=Math.min(price,strike)*.8,hi=Math.max(price,strike)*1.15;
 const pl=s=>kind==='put'?(prem-Math.max(strike-s,0))*q:((s-basis)+prem-Math.max(s-strike,0))*q;
 const pts=[];for(let i=0;i<=80;i++){const s=lo+(hi-lo)*i/80;pts.push([s,pl(s)])}
 const ys=pts.map(p=>p[1]);let ymin=Math.min(...ys,0),ymax=Math.max(...ys,0);const pad=(ymax-ymin)*.1||1;ymin-=pad;ymax+=pad;
 const X=s=>P.l+(s-lo)/(hi-lo)*(W-P.l-P.r),Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
 const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
 const area=(sign)=>'M'+X(lo)+' '+Y(0)+' '+pts.map(p=>'L'+X(p[0]).toFixed(1)+' '+Y(sign>0?Math.max(p[1],0):Math.min(p[1],0)).toFixed(1)).join(' ')+' L'+X(hi)+' '+Y(0)+'Z';
 const ticks=[lo,strike,price,hi].filter((v,i,a)=>a.findIndex(x=>Math.abs(x-v)<(hi-lo)*.06)===i);
 return `<div class="card payoff stack"><h3>Profit or loss at expiry</h3><p class="small muted">Horizontal axis: ${kind==='put'?'stock price at expiry':'stock price at expiry'}. Green area = profit, red = loss.</p>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payoff diagram">
 <path class="gain" d="${area(1)}"/><path class="loss" d="${area(-1)}"/>
 <line class="axis" x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}"/><line class="zero" x1="${P.l}" y1="${Y(0)}" x2="${W-P.r}" y2="${Y(0)}"/>
 <path class="line" d="${d}"/>

/* ---------- OPTION MATH (Black-Scholes, European style) ---------- */
function ncdf(x){const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2);const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
function bs(S,K,T,sig,r,q){if(!(S>0&&K>0&&T>0&&sig>0))return{call:NaN,put:NaN,dc:NaN,dp:NaN};const sq=sig*Math.sqrt(T),d1=(Math.log(S/K)+(r-q+sig*sig/2)*T)/sq,d2=d1-sq,eq=Math.exp(-q*T),er=Math.exp(-r*T);
 return{call:S*eq*ncdf(d1)-K*er*ncdf(d2),put:K*er*ncdf(-d2)-S*eq*ncdf(-d1),dc:eq*ncdf(d1),dp:-eq*ncdf(-d1)}}
function impliedVol(kind,price,S,K,T,r,q){let lo=.005,hi=4;const f=s=>bs(S,K,T,s,r,q)[kind]-price;if(!(f(lo)<0&&f(hi)>0))return NaN;for(let i=0;i<80;i++){const m=(lo+hi)/2;f(m)>0?hi=m:lo=m}return (lo+hi)/2}

/* ---------- EXPIRY DATES ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function isHoliday(d){const y=d.getFullYear(),md=(d.getMonth()+1)+'-'+d.getDate();if(['1-1','5-1','12-24','12-25','12-26','12-31'].includes(md))return true;const e=easter(y),gf=new Date(e),em=new Date(e);gf.setDate(e.getDate()-2);em.setDate(e.getDate()+1);return d.toDateString()===gf.toDateString()||d.toDateString()===em.toDateString()}
function thirdFriday(y,m){const d=new Date(y,m,1);const add=(5-d.getDay()+7)%7;d.setDate(1+add+14);let moved=false;while(isHoliday(d)||d.getDay()===0||d.getDay()===6){d.setDate(d.getDate()-1);moved=true}return{d,moved}}
function upcomingExpiries(n=9){const now=new Date();now.setHours(0,0,0,0);const out=[];let y=now.getFullYear(),m=now.getMonth();while(out.length<n){const e=thirdFriday(y,m);if(e.d>=now)out.push({...e,dte:Math.round((e.d-now)/864e5)});m++;if(m>11){m=0;y++}}return out}
const fmtDate=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  $('#rUse').onclick=()=>{Object.assign(C,{mode:k==='put'?'put':'call',price:S0,strike:K,prem:+mid.toFixed(2),size:mult,dte:e.dte});store.set('calc',C);go('calc')};
 }
 chain();real();
};

R.degiro=()=>{
 $('#main').innerHTML=`<div class="view">
 <div class="stack"><span class="eyebrow">Practical</span><h1>Doing it at DEGIRO</h1>
 <p class="lede">I could not open DEGIRO's own website while building this app, so the facts below come from broker reviews and DEGIRO's help pages as quoted by others. Items marked <span class="chip warn">check</span> need confirming in your own account or with DEGIRO support.</p></div>
 <div class="card stack"><h2>What DEGIRO offers for this plan</h2><div class="tablewrap"><table><thead><tr><th>Item</th><th>What sources say</th><th></th></tr></thead><tbody>
 <tr><td>European stock options (Euronext Amsterdam, Eurex)</td><td>Available</td><td><span class="chip go">likely</span></td></tr>
 <tr><td>Index options: AEX, Mini AEX, Euro Stoxx 50</td><td>Available</td><td><span class="chip go">likely</span></td></tr>
 <tr><td>Options on single US stocks (Apple, Nvidia…)</td><td>Several reviews say <b>not available</b>; only US index options</td><td><span class="chip warn">check</span></td></tr>
 <tr><td>Writing (selling) options</td><td>Needs a profile that allows derivatives and short positions (reviews mention Active or Trader)</td><td><span class="chip warn">check</span></td></tr>
 <tr><td>Fees</td><td>Reviews quote roughly €0.75–€2 per contract plus a possible handling fee; a fee for exercise/assignment; a monthly fee for US derivatives exchanges</td><td><span class="chip warn">check fee schedule</span></td></tr>
 <tr><td>Cash-secured check</td><td>DEGIRO uses margin ("free space"), not a cash-secured check. You set aside the cash yourself</td><td><span class="chip info">your rule</span></td></tr>
 </tbody></table></div></div>
 <div class="card stack"><h2>One-time setup</h2><ol class="steps">
  <li><div><b>Check your profile.</b> In the DEGIRO web trader or app, open your account / profile settings and see whether options and short positions are allowed. If not, request a profile change.</div></li>
  <li><div><b>Pass the knowledge (appropriateness) test.</b> EU rules require brokers to check that you understand derivatives. Finish the lessons in this app first.</div></li>
  <li><div><b>Activate the exchanges</b> you need (Euronext Amsterdam, Eurex) under market data / exchange settings if DEGIRO asks for it.</div></li>
  <li><div><b>Read the fee schedule</b> ("Tarievenoverzicht" / Fee Schedule) for options and for assignment.</div></li>
 </ol></div>
 <div class="card stack"><h2>Selling a put, step by step</h2><ol class="steps">
  <li><div>Search the underlying (for example <i>ING</i>) and open its <b>options</b> (via product search, filter on Options, or the derivatives tab on the product page).</div></li>
  <li><div>Pick the <b>expiry</b> (30–45 days, before earnings), then <b>Put</b>, then the <b>strike</b> from your plan. Check the contract size in the product info.</div></li>
  <li><div>Click <b>Sell</b>. Because you do not own this option, selling opens a short position. That is correct for this plan.</div></li>
  <li><div>Order type <b>Limit</b>. Price: the middle of bid and ask, rounded. If it does not fill, lower it one tick at a time. Never use a market order.</div></li>
  <li><div>Read the order confirmation: number of contracts, price, fee, and the effect on your free space. Then confirm.</div></li>
  <li><div>Right after the fill, place the <b>take-profit</b>: a Buy limit order at 50% of the premium (Good-till-cancelled if available). Write the trade in the Journal.</div></li>
 </ol></div>
 <div class="grid2">
  <div class="card prose"><h3>Closing early</h3><p>Open the position in your portfolio and choose <b>Buy</b> with the same number of contracts. This closes the short put.</p></div>
  <div class="card prose"><h3>Assignment</h3><p>If the put ends in the money (or is exercised early), the shares appear in your account and the cash leaves it. DEGIRO informs you; there may be a fee. For index options, cash is settled instead.</p></div>
  <div class="card prose"><h3>Covered call</h3><p>You need the shares in your DEGIRO account (usually 100 per contract). Open the options of that stock, pick a call, and <b>Sell</b> with a limit order.</p></div>
  <div class="card prose"><h3>Put credit spread</h3><p>Enter two orders with the same expiry: first <b>Buy</b> the lower-strike put, then <b>Sell</b> the higher-strike put. Check whether DEGIRO offers a combination order in your platform.</p></div>
 </div>
 <div class="stopbox"><b>Margin warning.</b> Even if you keep cash aside, DEGIRO measures risk with its own margin model. In a sharp fall, margin needs can rise quickly. If your free space goes negative, DEGIRO can close positions for you, at bad prices. Keeping full cash and small positions prevents this.</div>
 ${disclaimer}</div>`;
};

 const openObl=J.filter(t=>t.status==='Open'&&t.type==='Short put').reduce((s,t)=>s+t.strike*t.size*t.n,0);

 </div><label>Why this trade? (market state, setup, exits)<input id="j_note"></label>

 <div class="tablewrap"><table><thead><tr><th>Date</th><th>Underlying</th><th>Type</th><th class="n">Strike</th><th>Expiry</th><th class="n">Qty</th><th class="n">Premium</th><th>Status</th><th class="n">Close price</th><th class="n">Result</th><th></th></tr></thead><tbody>
 ${rows.length?rows.map((t,i)=>`<tr><td class="mono small">${esc(t.date)}</td><td><b>${esc(t.und)}</b>${t.note?`<br><span class="small muted">${esc(t.note)}</span>`:''}</td><td>${esc(t.type)}</td><td class="n">${t.strike}</td><td class="mono small">${esc(t.expiry)}</td><td class="n">${t.n}×${t.size}</td><td class="n">${(+t.prem).toFixed(2)}</td>
 <td>${t.ex?esc(t.status):`<select data-i="${i}" class="jst">${['Open','Closed','Expired','Assigned'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select>`}</td>
 <td class="n">${t.ex?t.close:`<input data-i="${i}" class="jcl" type="number" step="0.01" style="width:80px" value="${t.close??''}" ${t.status!=='Closed'?'disabled':''}>`}</td>
 <td class="n mono" style="color:${pl(t)>0?'var(--go)':pl(t)<0?'var(--stop)':'inherit'}">${isNaN(pl(t))?'open':eur2(pl(t))}</td><td>${t.ex?'':`<button class="btn small jdel" data-i="${i}" aria-label="Delete trade">Delete</button>`}</td></tr>`).join(''):'<tr><td colspan="11" class="muted">No trades yet. Add your first one above.</td></tr>'}
 </tbody></table></div>
 <div class="card stack"><h3>Backup</h3><p class="small muted">Copy the backup text and keep it in a note. To restore, paste it in the box and press Restore.</p>

  const all=store.get('journal',[])||[];all.unshift({id:Date.now(),date:g('date'),und:g('und'),type:g('type'),strike:+g('strike'),expiry:g('expiry'),n:+g('n')||1,size:+g('size')||100,prem:+g('prem'),fees:+g('fees')||0,status:'Open',close:'',note:g('note')});save(all);toast('Trade added')};

 $('#jCopy').onclick=()=>{const txt=JSON.stringify({journal:J,checks:store.get('checks',{}),custom:store.get('custom',[]),settings:S});$('#jBox').value=txt;
